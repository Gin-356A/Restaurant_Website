<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy's Diner</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="hero-section">

        <header>
            <nav class="logo">
                <img
                    src="Images/header.svg"
                    alt="Jimmy's Diner logo"
                    id="logo"
                >
            </nav>
        </header>

        <main>

            <section class="menu-section">
                <ul class="items"></ul>
            </section>

            <section class="bill-section"></section>
            <section class="payment-details">
                <form id="details-form">
                    <h3>
                        Enter card details
                    </h3>
                    <label for="name">Enter your Name</label>
                    <input type="text" id="name" name="user-name"
                    placeholder="Gin" required>

                    <label for="card-number">
                        Enter card number
                    </label>
                    <input type="text" id="card-number" name="user-card-number"
                    placeholder="1245 53434 343" required>

                    <label for="card-cvv">Enter CVV</label>
                    <input type="text" id="card-cvv" name="user-card-cvv"
                    placeholder="Gin" required>

                    <div class="submit-section">
                        <button type="submit" class="submit-btn">
                            Pay
                        </button>
                    </div>
                </form>
            </section>
        </main>

    </div>

    <script src="index.js" type="module"></script>

</body>

</html>
