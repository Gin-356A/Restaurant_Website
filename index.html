<html>
    <head>
       <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="hero-section">
            <header>
                <nav class="logo">
                <img
                    src="Images/header.svg"
                    alt="Logo of the company which says Jimmy's Diner , The best burgers and pizzas in town "
                    id="logo">
                </nav>
            </header>

            <main>
                <section class="menu-section">
                    <ul class="items">


                        <li class="item">
                            <img src="./Images/pizza.jpg">
                            <div class="item-details">
                                    <h3>Pizza</h3>
                                    <p>pepperoni,mushrom,mozarella</p>
                                    <p><span>$14</span></p>
                                    
                            </div>
                            <button class="add-btn">+</button>
                        </li>

                        <li class="item">

                            <img src="./Images/burger.png">
                            <div class="item-details">
                                    <h3>Burger</h3>
                                    <p>Chicken,cheese,lettuce</p>
                                    <p><span>$12</span></p>
                                    
                            </div>
                            <button class="add-btn">+</button>
                            
                        </li>
                        <li class="item">
                            <img src="./Images/drink.png">
                            <div class="item-details">
                                    <h3>Apple Juice</h3>
                                    <p>Apple,yest</p>
                                    <p><span>$12</span></p>
                                    
                            </div>
                            <button class="add-btn">+</button>
                        </li>
                    </ul>
                </section>
            </main>

        </div>

	<script src="index.js"></script>
    </body>
</html>
