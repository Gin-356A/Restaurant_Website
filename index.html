<html>

<head>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="hero-section">
        <header>
            <nav class="logo">
                <img src="Images/header.svg"
                    alt="Logo of the company which says Jimmy's Diner , The best burgers and pizzas in town " id="logo">
            </nav>
        </header>

        <main>
            <section class="menu-section">
                <ul class="items">

                </ul>
            </section>

            <section class="bill-section">
                <h3>Your Order</h3>

                <ul class="bill-list">

                    <li class="billed-items">
                        <div class="item-info">
                            <h3>Pizza</h3>
                            <button class="remove-btn">remove</button>
                        </div>

                        <p>$14</p>
                    </li>

                    <li class="billed-items">
                        <div class="item-info">
                            <h3>Beer</h3>
                            <button class="remove-btn">remove</button>
                        </div>

                        <p>$12</p>
                    </li>

                </ul>

                <div class="total-bill">
                    <h3 >Total price:</h3>
                    <p>$26</p>
                </div>

                <div class="order">
                    <button class="order-btn">Complete order</button>
                </div>
            </section>
        </main>


    </div>

    <script src="index.js" type="module"></script>
</body>

</html>
